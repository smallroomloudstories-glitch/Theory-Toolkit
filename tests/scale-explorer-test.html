<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theory Toolkit - Scale Explorer Test 3</title><style>body{font-family:sans-serif;max-width:1200px;margin:2rem auto;padding:0 1rem}.controls{display:flex;flex-wrap:wrap;gap:1rem;align-items:end;margin:1.5rem 0}label{display:grid;gap:.35rem;font-weight:bold}select{font:inherit;padding:.45rem .6rem}select:disabled{opacity:.5}.summary{margin:1rem 0 1.5rem;padding:.8rem 1rem;background:#f3f3f3;border:1px solid #ccc}.fretboard-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{border:1px solid #bbb;padding:.45rem;text-align:center;min-width:2.7rem}th:first-child,td:first-child{text-align:left;white-space:nowrap}td.scale-note{font-weight:bold;background:#e8e8e8}td.root-note{outline:3px solid currentColor;outline-offset:-4px}td.not-in-scale{color:#bbb}</style></head><body>
<h1>Scale Explorer — Test 3</h1><p>Explicit string-by-string diatonic and pentatonic scale-shape definitions.</p><div class="controls"><label>Root / Key<select id="root"></select></label><label>Scale<select id="scale"><option value="major">Major</option><option value="minor">Minor</option></select></label><label>Scale View<select id="scale-view"><option value="diatonic">Diatonic</option><option value="pentatonic">Pentatonic</option></select></label><label>Display<select id="display"><option value="fretboard">Fretboard</option><option value="position">Position</option></select></label><label>Position<select id="position" disabled><option value="0">Shape 1</option><option value="1">Shape 2</option><option value="2">Shape 3</option><option value="3">Shape 4</option><option value="4">Shape 5</option></select></label></div><div class="summary" id="summary"></div><div class="fretboard-wrap"><table><thead id="fretboard-head"></thead><tbody id="fretboard-body"></tbody></table></div>
<script type="module">import{CHROMATIC_SHARPS,STANDARD_GUITAR_TUNING}from"../src/data/music-data.js";import{buildFretboard}from"../src/engine/fretboard.js";
const SCALE_FORMULAS={diatonic:{major:{name:"Major",semitones:[0,2,4,5,7,9,11]},minor:{name:"Minor",semitones:[0,2,3,5,7,8,10]}},pentatonic:{major:{name:"Major Pentatonic",semitones:[0,2,4,7,9]},minor:{name:"Minor Pentatonic",semitones:[0,3,5,7,10]}}};
// All reference arrays: string 6 (low E) through string 1 (high E).
const G_MAJOR_DIATONIC=[[[2,3,5],[2,3,5],[2,4,5],[2,4,5],[3,5],[2,3,5]],[[5,7,8],[5,7],[4,5,7],[4,5,7],[5,7,8],[5,7,8]],[[7,8,10],[7,9,10],[7,9,10],[7,9],[7,8,10],[7,8,10]],[[10,12],[9,10,12],[9,10,12],[9,11,12],[10,12,13],[10,12]],[[12,14,15],[12,14,15],[12,14],[11,12,14],[12,13,15],[12,14,15]]];
// G-major pentatonic Shapes 1-5, transcribed from the supplied verified diagram.
const G_MAJOR_PENTATONIC=[[[3,5],[2,5],[2,5],[2,4],[3,5],[3,5]],[[5,7],[5,7],[5,7],[4,7],[5,8],[5,7]],[[7,10],[7,10],[7,9],[7,9],[8,10],[7,10]],[[10,12],[10,12],[9,12],[9,12],[10,12],[10,12]],[[12,15],[12,14],[12,14],[12,14],[12,15],[12,15]]];
const MINOR_FROM_MAJOR=[4,0,1,2,3],MAX_FRET=18,fretboard=buildFretboard(STANDARD_GUITAR_TUNING,MAX_FRET);const rootSelect=document.querySelector("#root"),scaleSelect=document.querySelector("#scale"),scaleViewSelect=document.querySelector("#scale-view"),displaySelect=document.querySelector("#display"),positionSelect=document.querySelector("#position"),summary=document.querySelector("#summary"),fretboardHead=document.querySelector("#fretboard-head"),fretboardBody=document.querySelector("#fretboard-body");rootSelect.innerHTML=CHROMATIC_SHARPS.map(n=>`<option value="${n}" ${n==="G"?"selected":""}>${n}</option>`).join("");
function buildScale(root,f){const i=CHROMATIC_SHARPS.indexOf(root);return f.semitones.map(o=>CHROMATIC_SHARPS[(i+o)%12])}function rootOffsetFromG(root){return(CHROMATIC_SHARPS.indexOf(root)-CHROMATIC_SHARPS.indexOf("G")+12)%12}function transposeShape(shape,a){return shape.map(s=>s.map(f=>f+a))}function selectedShape(root,q,v,p){const k=rootOffsetFromG(root),patterns=v==="diatonic"?G_MAJOR_DIATONIC:G_MAJOR_PENTATONIC;if(q==="major")return transposeShape(patterns[p],k);return transposeShape(patterns[MINOR_FROM_MAJOR[p]],k+3)}function visibleOccurrences(shape){const o=[];for(let oct=-2;oct<=2;oct++){const s=transposeShape(shape,oct*12);if(s.flat().some(f=>f>=0&&f<=MAX_FRET))o.push(s)}return o}function shapeCellSet(shape){const cells=new Set;for(const occ of visibleOccurrences(shape))occ.forEach((frets,pi)=>{const di=5-pi;frets.forEach(f=>{if(f>=0&&f<=MAX_FRET)cells.add(`${di}:${f}`)})});return cells}function renderHead(){fretboardHead.innerHTML=`<tr><th>String</th>${Array.from({length:MAX_FRET+1},(_,f)=>`<th>${f===0?"Open":f}</th>`).join("")}</tr>`}function render(){const root=rootSelect.value,q=scaleSelect.value,v=scaleViewSelect.value,d=displaySelect.value,p=Number(positionSelect.value),formula=SCALE_FORMULAS[v][q],notes=buildScale(root,formula),scaleSet=new Set(notes),use=d==="position",cells=use?shapeCellSet(selectedShape(root,q,v,p)):null;positionSelect.disabled=!use;summary.innerHTML=`<strong>${root} ${formula.name}:</strong> ${notes.join(" – ")} &nbsp;|&nbsp; <strong>${use?`Shape ${p+1}`:"Whole fretboard"}</strong>`;fretboardBody.innerHTML="";fretboard.forEach((s,i)=>{const row=document.createElement("tr");row.innerHTML=`<td>${s.label}</td>${s.frets.map(({note,fret})=>{const show=use?cells.has(`${i}:${fret}`):scaleSet.has(note),cls=[show?"scale-note":"not-in-scale",show&&note===root?"root-note":""].filter(Boolean).join(" ");return`<td class="${cls}">${show?note:"·"}</td>`}).join("")}`;fretboardBody.appendChild(row)})}renderHead();[rootSelect,scaleSelect,scaleViewSelect,displaySelect,positionSelect].forEach(el=>el.addEventListener("change",render));render();</script></body></html>
