<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theory Toolkit - Scale Explorer Test 3</title>
  <style>
    body { font-family: sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; margin: 1.5rem 0; }
    label { display: grid; gap: .35rem; font-weight: bold; }
    select { font: inherit; padding: .45rem .6rem; }
    select:disabled { opacity: .5; }
    .summary { margin: 1rem 0 1.5rem; padding: .8rem 1rem; background: #f3f3f3; border: 1px solid #ccc; }
    .fretboard-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 900px; }
    th, td { border: 1px solid #bbb; padding: .45rem; text-align: center; min-width: 2.7rem; }
    th:first-child, td:first-child { text-align: left; white-space: nowrap; }
    td.scale-note { font-weight: bold; background: #e8e8e8; }
    td.root-note { outline: 3px solid currentColor; outline-offset: -4px; }
    td.not-in-scale { color: #bbb; }
    td.outside-position { color: #ddd; background: #fafafa; }
    th.position-fret { background: #e8e8e8; }
  </style>
</head>
<body>
  <h1>Scale Explorer — Test 3</h1>
  <p>This temporary behavior test adds a five-position view. Shape 1 is anchored to the low-E-string root; Shapes 2–5 move through the next connected fretboard regions.</p>
  <div class="controls">
    <label>Root / Key<select id="root"></select></label>
    <label>Scale<select id="scale"><option value="major">Major</option><option value="minor">Minor</option></select></label>
    <label>Scale View<select id="scale-view"><option value="diatonic">Diatonic</option><option value="pentatonic">Pentatonic</option></select></label>
    <label>Display<select id="display"><option value="fretboard">Fretboard</option><option value="position">Position</option></select></label>
    <label>Position<select id="position" disabled><option value="0">Shape 1 — E-rooted</option><option value="1">Shape 2</option><option value="2">Shape 3</option><option value="3">Shape 4</option><option value="4">Shape 5</option></select></label>
  </div>
  <div class="summary" id="summary"></div>
  <div class="fretboard-wrap"><table><thead id="fretboard-head"></thead><tbody id="fretboard-body"></tbody></table></div>

  <script type="module">
    import { CHROMATIC_SHARPS, STANDARD_GUITAR_TUNING } from "../src/data/music-data.js";
    import { buildFretboard } from "../src/engine/fretboard.js";

    const SCALE_FORMULAS = {
      diatonic: { major: { name: "Major", semitones: [0,2,4,5,7,9,11] }, minor: { name: "Minor", semitones: [0,2,3,5,7,8,10] } },
      pentatonic: { major: { name: "Major Pentatonic", semitones: [0,2,4,7,9] }, minor: { name: "Minor Pentatonic", semitones: [0,3,5,7,10] } }
    };

    const POSITION_WINDOWS = [
      { label: "Shape 1 — E-rooted", start: -1, end: 2 },
      { label: "Shape 2", start: 2, end: 5 },
      { label: "Shape 3", start: 4, end: 8 },
      { label: "Shape 4", start: 7, end: 10 },
      { label: "Shape 5", start: 9, end: 12 }
    ];

    const MAX_FRET = 15;
    const fretboard = buildFretboard(STANDARD_GUITAR_TUNING, MAX_FRET);
    const rootSelect = document.querySelector("#root"), scaleSelect = document.querySelector("#scale"), scaleViewSelect = document.querySelector("#scale-view"), displaySelect = document.querySelector("#display"), positionSelect = document.querySelector("#position"), summary = document.querySelector("#summary"), fretboardHead = document.querySelector("#fretboard-head"), fretboardBody = document.querySelector("#fretboard-body");

    rootSelect.innerHTML = CHROMATIC_SHARPS.map(note => `<option value="${note}" ${note === "G" ? "selected" : ""}>${note}</option>`).join("");
    function buildScale(root, formula) { const i=CHROMATIC_SHARPS.indexOf(root); return formula.semitones.map(o=>CHROMATIC_SHARPS[(i+o)%12]); }
    function lowERootFret(root) { const m=fretboard[0].frets.find(({note,fret})=>note===root&&fret<=11); return m?m.fret:0; }
    function normalizedPositionWindow(root, positionIndex, scaleQuality) {
      const anchor=lowERootFret(root), region=POSITION_WINDOWS[positionIndex];
      let start=anchor+region.start, end=anchor+region.end;
      // Minor Shape 1 needs the b3 on string 6, three frets above its root.
      if (positionIndex === 0 && scaleQuality === "minor") end = Math.max(end, anchor + 3);
      while(end>MAX_FRET){start-=12;end-=12;} while(start<0){start+=12;end+=12;}
      return {start,end,label:region.label};
    }
    function renderHead(w){fretboardHead.innerHTML=`<tr><th>String</th>${Array.from({length:MAX_FRET+1},(_,f)=>`<th class="${w&&f>=w.start&&f<=w.end?"position-fret":""}">${f===0?"Open":f}</th>`).join("")}</tr>`;}
    function render(){
      const root=rootSelect.value,q=scaleSelect.value,v=scaleViewSelect.value,d=displaySelect.value,p=Number(positionSelect.value),formula=SCALE_FORMULAS[v][q],notes=buildScale(root,formula),set=new Set(notes),w=d==="position"?normalizedPositionWindow(root,p,q):null;
      positionSelect.disabled=d!=="position"; renderHead(w);
      summary.innerHTML=`<strong>${root} ${formula.name}:</strong> ${notes.join(" – ")}${w?` &nbsp;|&nbsp; <strong>${w.label}</strong> (frets ${w.start}–${w.end})`:" &nbsp;|&nbsp; <strong>Whole fretboard</strong>"}`; fretboardBody.innerHTML="";
      for(const s of fretboard){const row=document.createElement("tr");row.innerHTML=`<td>${s.label}</td>${s.frets.map(({note,fret})=>{const ins=set.has(note),inp=!w||(fret>=w.start&&fret<=w.end),show=ins&&inp,cls=[show?"scale-note":"not-in-scale",show&&note===root?"root-note":"",w&&!inp?"outside-position":""].filter(Boolean).join(" ");return `<td class="${cls}">${show?note:"·"}</td>`;}).join("")}`;fretboardBody.appendChild(row);}
    }
    [rootSelect,scaleSelect,scaleViewSelect,displaySelect,positionSelect].forEach(el=>el.addEventListener("change",render)); render();
  </script>
</body>
</html>
