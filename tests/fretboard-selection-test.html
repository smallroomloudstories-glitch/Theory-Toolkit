<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theory Toolkit - Fretboard Selection Test</title>
  <style>
    body { font-family: sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { margin-bottom: 1.25rem; }
    label { margin-right: 1rem; white-space: nowrap; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #bbb; padding: .45rem; text-align: center; }
    th:first-child, td:first-child { text-align: left; }
    .hidden-note { color: transparent; }
  </style>
</head>
<body>
  <h1>Fretboard Selection Test 1</h1>
  <p>This temporary page tests the first interaction from the v0.1 Fretboard Explorer: select one or more strings to reveal all notes on those strings.</p>

  <fieldset>
    <legend>Select String</legend>
    <div id="string-controls"></div>
    <label><input type="checkbox" id="show-all"> Show all</label>
  </fieldset>

  <table>
    <thead id="fretboard-head"></thead>
    <tbody id="fretboard-body"></tbody>
  </table>

  <script type="module">
    import { STANDARD_GUITAR_TUNING } from "../src/data/music-data.js";
    import { buildFretboard } from "../src/engine/fretboard.js";

    const fretboard = buildFretboard(STANDARD_GUITAR_TUNING, 12);
    const selectedStrings = new Set();
    const controls = document.querySelector("#string-controls");
    const showAll = document.querySelector("#show-all");

    for (const stringData of fretboard) {
      const label = document.createElement("label");
      label.innerHTML = `<input type="checkbox" value="${stringData.string}"> ${stringData.label}`;
      controls.appendChild(label);

      label.querySelector("input").addEventListener("change", (event) => {
        const stringNumber = Number(event.target.value);
        if (event.target.checked) selectedStrings.add(stringNumber);
        else selectedStrings.delete(stringNumber);
        renderFretboard();
      });
    }

    showAll.addEventListener("change", renderFretboard);

    document.querySelector("#fretboard-head").innerHTML = `
      <tr>
        <th>String</th>
        ${Array.from({ length: 13 }, (_, fret) => `<th>${fret === 0 ? "Open" : fret}</th>`).join("")}
      </tr>
    `;

    function renderFretboard() {
      const body = document.querySelector("#fretboard-body");
      body.innerHTML = "";

      for (const stringData of fretboard) {
        const reveal = showAll.checked || selectedStrings.has(stringData.string);
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${stringData.label}</td>
          ${stringData.frets.map(({ note }) => `<td class="${reveal ? "" : "hidden-note"}">${note}</td>`).join("")}
        `;
        body.appendChild(row);
      }
    }

    renderFretboard();
  </script>
</body>
</html>
