<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theory Toolkit - Fretboard Selection Test</title>
  <style>
    body { font-family: sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { margin-bottom: 1.25rem; }
    label { margin-right: 1rem; white-space: nowrap; }
    button { margin: .2rem; padding: .45rem .7rem; cursor: pointer; }
    button.selected { font-weight: bold; outline: 3px solid currentColor; outline-offset: 1px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #bbb; padding: .45rem; text-align: center; }
    th:first-child, td:first-child { text-align: left; }
    .hidden-note { color: transparent; }
    .selected-note { font-weight: bold; outline: 3px solid currentColor; outline-offset: -4px; }
  </style>
</head>
<body>
  <h1>Fretboard Selection Test 6</h1>
  <p>This temporary page includes the agreed persistent string scope and no-note-filter behavior.</p>

  <fieldset>
    <legend>Select String Scope</legend>
    <label><input type="radio" id="all-strings" name="string-scope" checked> All Strings</label>
    <div id="string-controls"></div>
  </fieldset>

  <fieldset>
    <legend>Select Notes</legend>
    <div id="note-controls"></div>
    <button type="button" id="clear-notes">Clear all</button>
  </fieldset>

  <fieldset>
    <legend>Display</legend>
    <label><input type="radio" name="display-mode" value="filter" checked> Filter selected notes</label>
    <label><input type="radio" name="display-mode" value="highlight"> Show all notes + highlight selections</label>
  </fieldset>

  <table>
    <thead id="fretboard-head"></thead>
    <tbody id="fretboard-body"></tbody>
  </table>

  <script type="module">
    import { CHROMATIC_SHARPS, STANDARD_GUITAR_TUNING } from "../src/data/music-data.js";
    import { buildFretboard } from "../src/engine/fretboard.js";

    const fretboard = buildFretboard(STANDARD_GUITAR_TUNING, 12);
    const selectedStrings = new Set();
    const selectedNotes = new Set();
    const controls = document.querySelector("#string-controls");
    const noteControls = document.querySelector("#note-controls");
    const allStrings = document.querySelector("#all-strings");
    const clearNotes = document.querySelector("#clear-notes");
    const stringCheckboxes = [];
    const noteButtons = new Map();

    for (const stringData of fretboard) {
      const label = document.createElement("label");
      label.innerHTML = `<input type="checkbox" value="${stringData.string}"> ${stringData.label}`;
      controls.appendChild(label);

      const checkbox = label.querySelector("input");
      stringCheckboxes.push(checkbox);

      checkbox.addEventListener("change", (event) => {
        const stringNumber = Number(event.target.value);

        if (event.target.checked) {
          allStrings.checked = false;
          selectedStrings.add(stringNumber);
        } else {
          selectedStrings.delete(stringNumber);
          if (selectedStrings.size === 0) allStrings.checked = true;
        }

        renderFretboard();
      });
    }

    allStrings.addEventListener("change", () => {
      if (allStrings.checked) {
        selectedStrings.clear();
        for (const checkbox of stringCheckboxes) checkbox.checked = false;
      }
      renderFretboard();
    });

    for (const note of CHROMATIC_SHARPS) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = note;
      button.setAttribute("aria-pressed", "false");
      noteControls.appendChild(button);
      noteButtons.set(note, button);

      button.addEventListener("click", () => {
        if (selectedNotes.has(note)) selectedNotes.delete(note);
        else selectedNotes.add(note);
        updateNoteButtons();
        renderFretboard();
      });
    }

    clearNotes.addEventListener("click", () => {
      selectedNotes.clear();
      updateNoteButtons();
      renderFretboard();
    });

    for (const radio of document.querySelectorAll('input[name="display-mode"]')) {
      radio.addEventListener("change", renderFretboard);
    }

    function displayMode() {
      return document.querySelector('input[name="display-mode"]:checked').value;
    }

    function updateNoteButtons() {
      for (const [note, button] of noteButtons) {
        const selected = selectedNotes.has(note);
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      }
    }

    document.querySelector("#fretboard-head").innerHTML = `
      <tr>
        <th>String</th>
        ${Array.from({ length: 13 }, (_, fret) => `<th>${fret === 0 ? "Open" : fret}</th>`).join("")}
      </tr>
    `;

    function renderFretboard() {
      const body = document.querySelector("#fretboard-body");
      body.innerHTML = "";
      const mode = displayMode();
      const hasNoteFilter = selectedNotes.size > 0;

      for (const stringData of fretboard) {
        const stringMatches = allStrings.checked || selectedStrings.has(stringData.string);
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${stringData.label}</td>
          ${stringData.frets.map(({ note }) => {
            const noteMatches = selectedNotes.has(note);
            let visible;

            if (mode === "highlight") {
              visible = stringMatches;
            } else if (hasNoteFilter) {
              visible = stringMatches && noteMatches;
            } else {
              // No selected notes means no note filter: show every note in scope.
              visible = stringMatches;
            }

            const classes = [
              visible ? "" : "hidden-note",
              visible && noteMatches ? "selected-note" : ""
            ].filter(Boolean).join(" ");
            return `<td class="${classes}">${note}</td>`;
          }).join("")}
        `;
        body.appendChild(row);
      }
    }

    updateNoteButtons();
    renderFretboard();
  </script>
</body>
</html>
